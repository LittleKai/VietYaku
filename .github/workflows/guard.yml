# Rào chắn của Bảng bẫy (.claude/IMPORTANT_FIXED_BUGS.md) phải còn trong code.
# Chỉ cần Python stdlib — không cài Flutter, không cần data/ (không commit).
name: guard_check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 .claude/guard_check.py
